server:
  shutdown: graceful
  address: 127.0.0.1
  port: ${TRAVEL_PORT:8080}
  error:
    include-message: always
app:
  desktop:
    enabled: ${TRAVEL_DESKTOP:true}
  data-dir: ${TRAVEL_DATA_DIR:./data}
  geography:
    tianditu-key: ${TIANDITU_KEY:}
    offline: ${TRAVEL_OFFLINE:false}
spring:
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 257MB
      location: ${app.data-dir}/uploads
  application:
    name: travel-recording
  datasource:
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
      data-source-properties:
        busy_timeout: 5000
        journal_mode: WAL
  flyway:
    enabled: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
logging:
  file:
    name: ${app.data-dir}/logs/application.log
